name: Build Vesper APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install dependencies & Setup Android
        run: |
          cd vesper
          npm install
          npx cap add android || true
          npx cap sync android

      - name: Build APK
        run: |
          cd vesper/android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Vesper-APK
          path: vesper/android/app/build/outputs/apk/debug/*.apk
