name: Build Vesper APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Extract Vesper Project Zip
        run: |
          unzip -o "VESPER-v16-project.zip"

      - name: Install dependencies & Setup Android
        run: |
          PKG_PATH=$(find . -name "package.json" -not -path "*/node_modules/*" | head -n 1)
          if [ -z "$PKG_PATH" ]; then
            echo "Error: package.json tidak ditemukan setelah diekstrak!"
            exit 1
          fi
          PROJECT_DIR=$(dirname "$PKG_PATH")
          echo "Project directory found at: $PROJECT_DIR"
          cd "$PROJECT_DIR"
          
          npm install
          npx cap add android || true
          npx cap sync android

      - name: Build APK
        run: |
          GRADLE_PATH=$(find . -name "gradlew" -not -path "*/node_modules/*" | head -n 1)
          if [ -z "$GRADLE_PATH" ]; then
            echo "Error: Gradle wrapper tidak ditemukan!"
            exit 1
          fi
          ANDROID_DIR=$(dirname "$GRADLE_PATH")
          echo "Android directory found at: $ANDROID_DIR"
          cd "$ANDROID_DIR"
          
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Vesper-APK
          path: "**/app/build/outputs/apk/debug/*.apk"
